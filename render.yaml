services:
  - type: web
    name: marketpilot-ai-backend
    runtime: python
    plan: starter
    numInstances: 1
    buildCommand: pip install -r requirements.txt
    startCommand: python -m alembic upgrade head && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/ready
    disk:
      name: marketpilot-sqlite
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        value: sqlite:////var/data/marketpilot.db
      - key: COOKIE_SECURE
        value: "true"
      - key: SESSION_HOURS
        value: "24"
      - key: AI_ENABLED
        value: "false"
      - key: OPENAI_MODEL
        value: gpt-4.1-mini
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWED_HOSTS
        sync: false

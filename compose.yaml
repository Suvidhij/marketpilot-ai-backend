services:
  backend:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: sqlite:////app/data/marketpilot.db
    volumes:
      - marketpilot-data:/app/data
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
  ui:
    build: ../marketpilot-ai-ui
    restart: unless-stopped
    environment:
      API_BACKEND_URL: http://backend:8000
      APP_ORIGIN: ${APP_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
  n8n:
    image: n8nio/n8n:2
    profiles: [automation]
    restart: unless-stopped
    environment:
      TZ: ${TZ:-UTC}
      GENERIC_TIMEZONE: ${TZ:-UTC}
      N8N_SECURE_COOKIE: "false"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
    ports:
      - "127.0.0.1:5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
volumes:
  marketpilot-data:
  n8n-data:
